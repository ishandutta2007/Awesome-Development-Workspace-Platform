<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#title-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #8b949e;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #c9d1d9;
    }
    .pulse-circle {
      animation: pulse 4s infinite alternate ease-in-out;
    }
    .float-card {
      animation: float 6s infinite alternate ease-in-out;
    }
    .wave-line {
      stroke-dasharray: 8 8;
      animation: dash 30s linear infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.3; }
      100% { transform: scale(1.02); opacity: 0.7; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)" />
  </g>

  <!-- Dynamic / Animated Background Graphical Elements (Behind Text) -->
  <g class="pulse-circle" opacity="0.4" style="transform-origin: 1000px 80px;">
    <circle cx="1000" cy="80" r="140" fill="url(#glow-grad)"/>
    <circle cx="1000" cy="80" r="90" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  <g class="pulse-circle" opacity="0.3" style="transform-origin: 150px 280px; animation-delay: -2s;">
    <circle cx="150" cy="280" r="120" fill="url(#glow-grad)"/>
  </g>

  <!-- Background Animated Waves -->
  <path class="wave-line" d="M -100 280 Q 300 340 600 260 T 1300 280" fill="none" stroke="#bc8cff" stroke-width="2" opacity="0.25"/>
  <path class="wave-line" d="M -100 300 Q 400 220 800 320 T 1300 250" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.2" style="animation-duration: 40s;"/>

  <!-- Decorative Modern Floating Tech Pills (Positioned around borders, not obstructing text) -->
  <g class="float-card" filter="url(#shadow)" transform="translate(920, 200)">
    <rect width="210" height="48" rx="24" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="8" fill="#3fb950"/>
    <text x="48" y="29" class="badge-text">Cloud IDEs & Sandboxes</text>
  </g>

  <g class="float-card" filter="url(#shadow)" transform="translate(850, 120)" style="animation-delay: -3s;">
    <rect width="190" height="48" rx="24" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="8" fill="#58a6ff"/>
    <text x="48" y="29" class="badge-text">DevContainers Spec</text>
  </g>

  <!-- Foreground Content Container -->
  <g transform="translate(80, 0)">
    <!-- Top Decorative Line -->
    <rect x="0" y="75" width="80" height="5" rx="2.5" fill="#58a6ff" />
    
    <!-- Main Title (Strictly Foreground) -->
    <text x="0" y="130" class="title" filter="url(#shadow)">Awesome Development Workspace Platform</text>
    
    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Curated Ecosystem of Cloud Workspaces, DevEnvironments & Open-Source Tools</text>

    <!-- Feature Tags / Metadata Chips -->
    <g transform="translate(0, 220)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="22" font-family="system-ui" font-size="13" font-weight="600" fill="#58a6ff">⚡ Cloud Workspaces</text>

      <!-- Chip 2 -->
      <rect x="162" y="0" width="165" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="178" y="22" font-family="system-ui" font-size="13" font-weight="600" fill="#bc8cff">📦 DevContainers Spec</text>

      <!-- Chip 3 -->
      <rect x="339" y="0" width="150" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="355" y="22" font-family="system-ui" font-size="13" font-weight="600" fill="#3fb950">🤖 AI Code Sandboxes</text>
      
      <!-- Chip 4 -->
      <rect x="501" y="0" width="135" height="34" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="517" y="22" font-family="system-ui" font-size="13" font-weight="600" fill="#d29922">🛠️ Self-Hosted CDE</text>
    </g>
  </g>
</svg>
